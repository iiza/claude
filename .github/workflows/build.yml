name: Compilar Dictado para Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar
        shell: pwsh
        run: ./build.ps1

      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\Dictado\Dictado.exe" -ArgumentList "--selftest","--selftest-out",$out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "La autoprueba falló (código $($p.ExitCode))" }

      - name: Empaquetar versión portátil
        shell: pwsh
        run: Compress-Archive -Path dist\Dictado -DestinationPath dist\Dictado-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Dictado-Setup
          path: dist/Dictado-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Dictado-portable
          path: dist/Dictado-portable.zip
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Dictado-Setup.exe
            dist/Dictado-portable.zip
